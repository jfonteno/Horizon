name: horizon

services:
  horizon:
    build:
      context: .
    image: horizon-shattered-reach:0.17.2
    restart: unless-stopped
    user: "${HORIZON_UID:-1000}:${HORIZON_GID:-1000}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      HORIZON_DATA_DIR: /data/rooms
      HORIZON_CONTENT_DIR: /data/content
    ports:
      - "127.0.0.1:${HORIZON_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      horizon:
        condition: service_healthy
