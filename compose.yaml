name: horizon

services:
  horizon:
    build:
      context: .
    image: horizon-shattered-reach:0.34.8
    restart: unless-stopped
    user: "${HORIZON_UID:-1000}:${HORIZON_GID:-1000}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      HORIZON_DATA_DIR: /data/rooms
      HORIZON_CONTENT_DIR: /data/content
      HORIZON_ACCOUNT_DIR: /data/accounts
      HORIZON_OPERATIONS_PATH: /data/operations/settings.json
      HORIZON_MULTIPLAYER_VERIFICATION: ${HORIZON_MULTIPLAYER_VERIFICATION:-commander}
      HORIZON_AUTH_SECRET: ${HORIZON_AUTH_SECRET:-}
      HORIZON_ADMIN_ACCOUNT_IDS: ${HORIZON_ADMIN_ACCOUNT_IDS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      HORIZON_STEAM_SIGNIN: ${HORIZON_STEAM_SIGNIN:-disabled}
      HORIZON_EMAIL_PROVIDER: ${HORIZON_EMAIL_PROVIDER:-disabled}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      HORIZON_EMAIL_FROM: ${HORIZON_EMAIL_FROM:-}
    ports:
      - "127.0.0.1:${HORIZON_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      horizon:
        condition: service_healthy
