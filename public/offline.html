<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061820">
  <title>Horizon is offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 30%,#12313d 0,transparent 35%),#02080c;color:#dcebef;font-family:Arial,sans-serif}.card{width:min(560px,100%);padding:32px;border:1px solid #315866;background:#06151cf2;box-shadow:0 28px 90px #000}.eyebrow{color:#65cce2;font-size:11px;letter-spacing:.18em}.card img{display:block;width:min(360px,90%);margin:10px auto 28px}.card h1{margin:0 0 12px;font:36px Georgia,serif}.card p{color:#91a8b1;line-height:1.65}.card button{margin-top:12px;padding:12px 18px;border:1px solid #65cce2;background:#0a2631;color:#edf9fc;cursor:pointer}
  </style>
</head>
<body><main class="card"><span class="eyebrow">HORIZON NETWORK</span><img src="/horizon-logo.png" alt="Horizon"><h1>The network is beyond sensor range.</h1><p>Horizon needs a connection to create, join, or synchronize multiplayer games. Your installed application and saved device information remain available.</p><button onclick="location.reload()">Try reconnecting</button></main></body>
</html>
